#
# The known vulnerabilities this repository accepts, each until its expiry, in the form looper-scan reads
# (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD; tests/providers_test.sh checks it).
# Found by `govulncheck -mode=binary` (symbols present) in the pinned binaries, each at its latest upstream release,
# none with a fixed one (#3); enforced by the security job (ci/security.sh, #10), which fails on an expired entry.
# The gitlab and kubernetes providers are not here: they are built from source with the fixes (ci/gitlab-provider.sh;
# ci/kubernetes-provider.sh, kin-openapi v0.152.0 with its port, #23); nor are GitLab Runner and its fleeting plugin,
# built from source with go1.27.4, x/net v0.62.0 and klauspost/compress v1.20.2 (ci/runner.sh, #40); nor are the Go
# standard library findings of what we build (the tools, the scanners and the four providers, ci/tools.sh: GO-2026-6859
# among them, #39), fixed by building them with the latest Go, nor is the google provider's x/net, built with v0.62.0
# (ci/google-provider.sh, #39), nor gitleaks' and
# OSV-Scanner's klauspost/compress and brotli (GO-2026-6865, GO-2026-6888), fixed by building them with the fixed
# versions (ci/tools.sh, #24), nor the CI image's, fixed by its digest but for its gh's x/net (CVE-2026-78661, #27).
# Track and bump: move each pin to the first upstream release with the fix and remove its entries (PROPOSALS.md). The
# binaries, by pin:
#
#   OpenTofu 1.13.2 (ci/tools.sh)                         GO-2026-5932 6179 6180 6443 6603 6610 6611 6612 6617 6860 6865 6866
#   hashicorp/google 8.9.0 (ci/google-provider.sh, #39)   GO-2026-5932
#   tflint 0.65.0, tflint-ruleset-google 0.41.0           GO-2026-5932 6860 6866
#   gitleaks v8.30.1 (ci/tools.sh, #10)                   GO-2025-3922
#   Trivy 0.76.1 (ci/tools.sh, #10)                       GO-2026-5932 6860 6865 6866
#   the CI image build:2.6, v2.6.1's digest: its gh       CVE-2026-78661 (Trivy; tacplus-dev/tacplus#350 rebuilds it)
#   the CI image build:2.6, its zlib1g                    CVE-2026-85091 76844 (Trivy; the image rebuild, cluster#16)
exceptions:
  - id: GO-2026-5932
    reason: "x/crypto/openpgp (OpenTofu, the google provider, tflint and its ruleset, Trivy): no OpenPGP key or message from outside is handled; the providers come by lock-file hash and the tools by SHA-256. No release with x/crypto past v0.58.0 yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6179
    reason: "x/mod sumdb tlog tile verification (OpenTofu 1.13.2): OpenTofu does not use the Go checksum database for providers or modules here; providers are installed by lock-file hash. Fixed in x/mod v0.40.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6180
    reason: "x/mod sumdb Lookup hashes (OpenTofu 1.13.2): as GO-2026-6179, the checksum database is not consulted. Fixed in x/mod v0.40.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6443
    reason: "grpc server panic on a missing authority (OpenTofu 1.13.2): the only gRPC server is OpenTofu's plugin protocol to its own providers, pinned by hash, over a local socket. Fixed in grpc v1.83.2; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6603
    reason: "x/net HTTP/2 server Trailer memory exhaustion (OpenTofu): it serves no HTTP/2 to a network; it is a client of gitlab.com and Google APIs over TLS. Fixed in x/net v0.60.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6610
    reason: "x/net HTTP/2 transport accepts malformed framing headers (OpenTofu): its HTTP/2 peers are gitlab.com and Google APIs over verified TLS. Fixed in x/net v0.60.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6611
    reason: "x/net HTTP/2 repeated window changes CPU (OpenTofu): the peers are gitlab.com and Google APIs over verified TLS. Fixed in x/net v0.60.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6612
    reason: "x/net HTTP/2 server double flow-control refund (OpenTofu): it serves no HTTP/2 to a network. Fixed in x/net v0.60.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6617
    reason: "x/net HTTP/2 server HPACK encoder race (OpenTofu): it serves no HTTP/2 to a network. Fixed in x/net v0.60.0; no OpenTofu release with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6860
    reason: "x/net html quadratic text-node coalescing (OpenTofu, tflint and its ruleset, Trivy): the HTML they parse, if any, is from this repository, the pinned registries and Google APIs. Fixed in x/net v0.62.0; no release of them with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6866
    reason: "x/net html raw-text rendering namespaces (OpenTofu, tflint and its ruleset, Trivy): no untrusted HTML is rendered. Fixed in x/net v0.62.0; no release of them with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cloud#3, 2026-11-03)"
    expires: 2026-12-03
  - id: GO-2026-6865
    reason: "klauspost/compress panic on two-block frames, fse/huff0 (OpenTofu 1.13.2, Trivy 0.76.1, upstream's downloads): they decode only pinned, trusted inputs (lock-file hashes, this repository, the CI image by digest), no untrusted compressed stream. Fixed in v1.20.2; no release of them with it yet (OpenTofu 1.13.9 and Trivy 0.76.2 still lack it). gitleaks, OSV-Scanner (ci/tools.sh) and GitLab Runner (ci/runner.sh, #40) are built here with v1.20.2."
    decided_by: "jodydadescott (tacplus-dev/cloud#24, 2026-11-06)"
    expires: 2026-12-06
  - id: GO-2025-3922
    reason: "github.com/ulikunitz/xz v0.5.12 in gitleaks v8.30.1 (the security job's secrets scan): memory leaks decoding corrupted LZMA archives. gitleaks decodes no archive here (--max-archive-depth is not set: archives are not scanned), and what it reads is this repository's tree and history. Fixed in xz v0.5.15; no gitleaks release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cloud#10, 2026-11-04: accept what has no fixed release, 30 days)"
    expires: 2026-12-04
  - id: CVE-2026-78661
    reason: "golang.org/x/net/html DoS via crafted HTML input, x/net v0.60.0 in the CI image's usr/local/bin/gh (ghcr.io/tacplus-dev/tacplus/build:2.6, v2.6.1's digest): gh parses only GitHub API responses over TLS, never untrusted HTML. Fixed in x/net v0.62.0; no build image with a gh built on it yet (tacplus-dev/tacplus#350): move the CI image's digest when one ships, and drop this entry."
    decided_by: "hub (Jody's delegation, 2026-11-07; tacplus-dev/cloud#27)"
    expires: 2026-12-06
  - id: CVE-2026-85091
    reason: "zlib gz_vacate() heap overflow, zlib1g/zlib1g-dev 1:1.3.dfsg+really1.3.1-1+b1 in the CI image (ghcr.io/tacplus-dev/tacplus/build:2.6, Debian 13.7): no job here decompresses untrusted gzip input (tools and providers come by SHA-256 or lock-file hash). No Debian fix in the image yet: move the CI image's digest when a rebuilt one ships (tacplus-dev/tacplus#283's rebuild), and drop this entry."
    decided_by: "hub (Jody's delegation, 2026-11-07; tacplus-dev/cluster#16, the same finding)"
    expires: 2026-12-06
  - id: CVE-2026-76844
    reason: "Reported by Trivy against zlib1g/zlib1g-dev in the CI image (build:2.6, Debian 13.7), with a webpack-dev-middleware path-traversal title: no webpack and no dev server in the image or any job here. Drop when the CI image's digest moves to a rebuilt image."
    decided_by: "hub (Jody's delegation, 2026-11-07; tacplus-dev/cluster#16, the same finding)"
    expires: 2026-12-06
