#
# The .gitlab-ci.yml of the GitLab project gitlab.com/tacplus-dev/cloud, kept here (github.com/tacplus-dev/cloud
# ci/gitlab-project.gitlab-ci.yml) and copied into that project with CLOUD_COMMIT set, and nothing else changed:
# `ci/pin.sh <commit>` prints it, and the tools job refuses a copy that differs (the cluster pattern). Every job
# checks this repository out at that commit: it is public, so with no credential. Runbook: README.
#
#   tools                       the pinned tools into bin/ (ci/tools.sh), the copy checked (ci/pin.sh --check)
#   fmt, validate, tflint,      every push and merge request (ci/lint.sh, ci/checks.sh): no credential, no cloud;
#   shellcheck, policy, test    test plans every stack against mock providers
#   security                    every push, merge request and nightly schedule (ci/security.sh, #10): OSV-Scanner,
#                               govulncheck -mode=binary on the pinned binaries, gitleaks on the tree and its
#                               history, Trivy on this image; fails on a secret, or a HIGH or CRITICAL finding with
#                               a fix that no unexpired security-exceptions.yaml entry accepts; its report the
#                               artifact src/security/. No plan runs unless it passes.
#   plan:<stack>                main: the plan, saved (ci/tofu.sh plan), refused if ci/policy.sh refuses it
#   apply:<stack>               main, automatic once its plan succeeds: applies exactly that saved plan
#                               (ci/tofu.sh apply); the stack's environment, one apply at a time
#   drift                       the nightly schedule: a plan of every stack, and an issue on
#                               github.com/tacplus-dev/cloud if anything differs; never applies
#
# The stacks run in order: folder (the folders under the parent folder), then dev, then ci (the projects: ci reads
# dev's number), then gitlab (whose runners' tokens go to the ci project's secrets). Outside production nothing waits for Jody (tacplus-dev/roadmap
# decisions/deterministic-deployments-2026-11-02.md, addendum "approval only for production"): ci and dev apply on
# main once their plan succeeds. prod is not built; its apply-prod will be a protected manual job only Jody plays.
#
# The plan and apply jobs run on main only, where Workload Identity Federation admits this project (its
# provider's condition: protected main) as cloud-admin-pipeline. No key file and no token is stored in GitLab: the
# id_token is exchanged for each job, and the GitLab token is read from Secret Manager by version (ci/lib.sh).
# Every job runs on the project's own runner (tag `cloud`: a VM used once, with no Google account of its own).
stages: [lint, folder, projects, gitlab]

variables:
  # The commit of github.com/tacplus-dev/cloud this pipeline plans and applies; empty in the repository, set in
  # the GitLab project's copy (ci/pin.sh).
  CLOUD_COMMIT: ""
  GCP_DEPLOY_SA: cloud-admin-pipeline@tacplus-bootstrap.iam.gserviceaccount.com
  # The tacplus-reader app's key, in Cloud KMS (github_app_token in ci/lib.sh): the drift job files its issue with it,
  # as the job itself (the ci stack's binding, #30).
  TACPLUS_READER_KMS_KEY: projects/tacplus-ci/locations/us-central1/keyRings/looper/cryptoKeys/tacplus-reader

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web|api|schedule)$/

default:
  image: ghcr.io/tacplus-dev/tacplus/build:2.6.4@sha256:3c5d7fe2c00e1c4be9c53e576904ad32e63242dbb4a5489d137a34d95887c324
  tags: [cloud]
  interruptible: false
  before_script:
    # This repository at CLOUD_COMMIT, in src/ (where the tools job's bin/ and the plans' plans/ artifacts land).
    - |
      set -euo pipefail
      [[ "$CLOUD_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
        { echo "CLOUD_COMMIT is not a full commit hash: [$CLOUD_COMMIT]: the project's .gitlab-ci.yml is made with ci/pin.sh <commit> (README)" >&2; exit 1; }
      git init -q src
      git -C src fetch -q --depth 1 https://github.com/tacplus-dev/cloud.git "$CLOUD_COMMIT"
      git -C src checkout -q FETCH_HEAD
      echo "tacplus-dev/cloud at $CLOUD_COMMIT: $(git -C src log -1 --format=%s)"

tools:
  stage: lint
  needs: []
  script:
    - cd src && ci/pin.sh --check "$CI_PROJECT_DIR/.gitlab-ci.yml" && ci/tools.sh
  artifacts:
    paths: [src/bin/]
    expire_in: 1 week

fmt:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/lint.sh fmt

validate:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/lint.sh validate

tflint:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/lint.sh tflint

shellcheck:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/lint.sh shellcheck

policy:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/lint.sh policy

test:
  stage: lint
  needs: [tools]
  script:
    - cd src && ci/checks.sh

# tacplus-dev/looper#49's floor, which tacplus-dev/build's checks never bring here. The full history, for gitleaks.
security:
  stage: lint
  needs: [tools]
  script:
    - git -C src fetch -q --unshallow https://github.com/tacplus-dev/cloud.git "$CLOUD_COMMIT"
    - cd src && ci/tools.sh security && ci/security.sh
  artifacts:
    when: always
    paths: [src/security/]
    expire_in: 30 days

# The jobs that reach GCP: main only, never from a merge request, each with its id_token.
.gcp:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER

.plan:
  extends: .gcp
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci/tofu.sh plan "$STACK"
  # The plan can hold secret values (the gitlab stack's variables): its artifacts are for project members only.
  artifacts:
    access: developer
    paths: [src/plans/]
    expire_in: 30 days

# Applies exactly the saved plan of the plan job it needs, automatically once that plan succeeds (not production).
.apply:
  extends: .gcp
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/
      when: on_success
  resource_group: cloud-$STACK
  environment: { name: $STACK, action: start }
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci/tofu.sh apply "$STACK"

plan:folder:
  extends: .plan
  stage: folder
  needs: [tools, fmt, validate, tflint, shellcheck, policy, test, security]
  variables: { STACK: folder }

apply:folder:
  extends: .apply
  stage: folder
  needs: [tools, plan:folder]
  variables: { STACK: folder }

# ci after dev: the ci stack reads the dev project's number, whose pool federates the reader's account (#30).
plan:ci:
  extends: .plan
  stage: projects
  needs: [tools, apply:dev]
  variables: { STACK: ci }

apply:ci:
  extends: .apply
  stage: projects
  needs: [tools, plan:ci]
  variables: { STACK: ci }

plan:dev:
  extends: .plan
  stage: projects
  needs: [tools, apply:folder]
  variables: { STACK: dev }

apply:dev:
  extends: .apply
  stage: projects
  needs: [tools, plan:dev]
  variables: { STACK: dev }

plan:gitlab:
  extends: .plan
  stage: gitlab
  needs: [tools, apply:ci]
  variables: { STACK: gitlab }
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci_gitlab && ci/build-ci.sh check && ci/build-ci.sh lint && ci/tofu.sh plan "$STACK"

apply:gitlab:
  extends: .apply
  stage: gitlab
  needs: [tools, plan:gitlab]
  variables: { STACK: gitlab }
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci_gitlab && ci/tofu.sh apply "$STACK"

# The nightly drift check: a plan of every stack, and an issue here when anything differs. It never applies.
drift:
  extends: .gcp
  stage: folder
  needs: [tools, fmt, validate, tflint, shellcheck, policy, test]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci_gitlab && ci/drift.sh folder ci dev gitlab
