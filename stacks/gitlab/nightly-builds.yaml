# The nightly builds of tacplus-dev/build (#26; tacplus-dev/looper#84): one pipeline schedule per pinned repository,
# on tacplus-dev/build's main, by the repository's name, with its cron (UTC; gitlab.com runs a schedule at most once
# an hour) and its inputs (tacplus-dev/looper ci/build.gitlab-ci.yml: repo and nightly: true, no sha, so the build
# scans main as it is then). A repository's pin issue adds it here, once its tacplus.lock or build.lock is on main:
# a nightly of a repository with no pin fails. The gitlab stack makes one schedule per entry.
looper:
  cron: "0 5 * * *"
  inputs:
    repo: looper
    nightly: true
cloud:
  cron: "0 6 * * *"
  inputs:
    repo: cloud
    nightly: true
